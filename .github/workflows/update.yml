name: Uppdatera Garmin-data

on:
  schedule:
    # Var 30:e minut 06–23 svensk tid (cron är i UTC). GitHub kan fördröja eller hoppa över körningar.
    - cron: "17,47 5-22 * * *"
  push:
    branches: [main]      # publicera om sidan när du ändrar koden
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Antal dagar att hämta första gången"
        default: "90"
      refresh_days:
        description: "Antal dagar att hämta om (sätt t.ex. 90 en gång för att fylla i nya fält)"
        default: "3"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: garmin-update
  cancel-in-progress: false

# Projektet ligger i undermappen garmin-health
defaults:
  run:
    working-directory: garmin-health

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: garmin-health/requirements.txt

      - run: pip install -r requirements.txt

      # Datan bor på grenen "data" (en enda commit som skrivs över) så att repot inte växer.
      - name: Hämta sparad data
        run: |
          mkdir -p store
          # Kör git archive från repots rot, annars packas bara undermappen garmin-health upp
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git -C "$GITHUB_WORKSPACE" archive FETCH_HEAD | tar -x -C store
          else
            echo "Ingen data-gren än, första körningen."
          fi
          ls -la store

      - name: Hämta från Garmin och skicka notiser
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '90' }}
          REFRESH_DAYS: ${{ github.event.inputs.refresh_days || '3' }}
          STORE_DIR: store
        run: python scripts/fetch.py

      - name: Spara data till grenen "data"
        run: |
          cd store
          git init -q -b data
          git config user.name "garmin-bot"
          git config user.email "garmin-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Garmin-data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Bygg sidan
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          cp store/data.enc _site/data.enc
          # Versionsnummer i filnamnen så att webbläsare inte visar gammal CSS/JS
          sed -i "s/__V__/${GITHUB_SHA::7}/g" _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: garmin-health/_site

  # Publiceringen körs som ett eget jobb som startar när bygget är helt klart.
  # I samma jobb hinner GitHubs API ibland inte visa den nyss uppladdade artefakten.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
