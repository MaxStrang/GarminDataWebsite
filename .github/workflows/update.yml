name: Uppdatera Garmin-data

on:
  schedule:
    # Varje timme 06–23 svensk tid (cron är i UTC)
    - cron: "17 5-22 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Antal dagar att hämta första gången"
        default: "90"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: garmin-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hämta sparad data
        run: |
          mkdir -p store
          if git fetch --depth=1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C store
          fi
          ls -la store

      - name: Hämta från Garmin och skicka notiser
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '90' }}
          STORE_DIR: store
        run: python scripts/fetch.py

      - name: Spara data till grenen "data"
        run: |
          cd store
          git init -q -b data
          git config user.name "garmin-bot"
          git config user.email "garmin-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Garmin-data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Bygg sidan
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          cp store/data.enc _site/data.enc

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
